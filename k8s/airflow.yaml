# Apache Airflow (LocalExecutor): one-shot init Job + webserver + scheduler.
# Metadata DB = the same Postgres database as the app, exactly like docker-compose.
apiVersion: v1
kind: ConfigMap
metadata:
  name: airflow-config
  namespace: job-intelligent
data:
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
  AIRFLOW__CORE__PARALLELISM: "4"
  # Pod hostnames are not resolvable in the cluster; advertise the pod IP so the
  # webserver can fetch task logs from the scheduler's log server (port 8793).
  AIRFLOW__CORE__HOSTNAME_CALLABLE: airflow.utils.net.get_host_ip_address
  AIRFLOW__WEBSERVER__WORKERS: "2"
  AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
  AIRFLOW__SCHEDULER__SCHEDULER_HEALTH_CHECK_SERVER_PORT: "8974"
  SELENIUM_URL: http://selenium:4444/wd/hub
---
# Env in every Airflow pod: app-config + airflow-config + app-secrets (envFrom),
# then the Airflow-specific names are built from them with $(VAR) expansion.
apiVersion: batch/v1
kind: Job
metadata:
  name: airflow-init
  namespace: job-intelligent
  labels: { app: airflow-init }
spec:
  backoffLimit: 4
  template:
    metadata:
      labels: { app: airflow-init }
    spec:
      restartPolicy: OnFailure
      containers:
        - name: airflow-init
          image: job-intelligent/airflow:1.0
          imagePullPolicy: IfNotPresent
          command: ["bash", "-c"]
          args:
            - |
              airflow db migrate &&
              (airflow users create --username admin --password "$AIRFLOW_ADMIN_PASSWORD" \
                 --firstname Admin --lastname User --role Admin \
                 --email admin@jobintelligent.com || echo "admin user already exists")
          envFrom:
            - configMapRef: { name: app-config }
            - configMapRef: { name: airflow-config }
            - secretRef:    { name: app-secrets }   # DB_PASS, FERNET_KEY, SECRET_KEY, FT_*, ...
          env:
            - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
              value: postgresql+psycopg2://$(DB_USER):$(DB_PASS)@$(DB_HOST):$(DB_PORT)/$(DB_NAME)
            - name: AIRFLOW__CORE__FERNET_KEY
              value: $(FERNET_KEY)
            - name: AIRFLOW__WEBSERVER__SECRET_KEY
              value: $(SECRET_KEY)
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: "1",  memory: 1Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow-webserver
  namespace: job-intelligent
  labels: { app: airflow-webserver }
spec:
  replicas: 1
  selector:
    matchLabels: { app: airflow-webserver }
  template:
    metadata:
      labels: { app: airflow-webserver }
    spec:
      initContainers:
        - name: wait-for-migrations   # blocks until airflow-init has migrated the DB
          image: job-intelligent/airflow:1.0
          imagePullPolicy: IfNotPresent
          args: ["db", "check-migrations", "--migration-wait-timeout", "600"]
          envFrom:
            - configMapRef: { name: app-config }
            - configMapRef: { name: airflow-config }
            - secretRef:    { name: app-secrets }   # DB_PASS, FERNET_KEY, SECRET_KEY, FT_*, ...
          env:
            - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
              value: postgresql+psycopg2://$(DB_USER):$(DB_PASS)@$(DB_HOST):$(DB_PORT)/$(DB_NAME)
            - name: AIRFLOW__CORE__FERNET_KEY
              value: $(FERNET_KEY)
            - name: AIRFLOW__WEBSERVER__SECRET_KEY
              value: $(SECRET_KEY)
      containers:
        - name: webserver
          image: job-intelligent/airflow:1.0
          imagePullPolicy: IfNotPresent
          args: ["webserver"]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef: { name: app-config }
            - configMapRef: { name: airflow-config }
            - secretRef:    { name: app-secrets }   # DB_PASS, FERNET_KEY, SECRET_KEY, FT_*, ...
          env:
            - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
              value: postgresql+psycopg2://$(DB_USER):$(DB_PASS)@$(DB_HOST):$(DB_PORT)/$(DB_NAME)
            - name: AIRFLOW__CORE__FERNET_KEY
              value: $(FERNET_KEY)
            - name: AIRFLOW__WEBSERVER__SECRET_KEY
              value: $(SECRET_KEY)
          resources:
            requests: { cpu: 200m, memory: 768Mi }
            limits:   { cpu: "1",  memory: 1536Mi }
          startupProbe:               # gunicorn boot is slow: allow up to 10 min
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            timeoutSeconds: 10        # default 1s is too short while the node is busy
            failureThreshold: 60
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 15
            timeoutSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: airflow-webserver
  namespace: job-intelligent
  labels: { app: airflow-webserver }
spec:
  type: NodePort
  selector: { app: airflow-webserver }
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow-scheduler
  namespace: job-intelligent
  labels: { app: airflow-scheduler }
spec:
  replicas: 1
  strategy:
    type: Recreate        # never two schedulers sharing /tmp handoff files
  selector:
    matchLabels: { app: airflow-scheduler }
  template:
    metadata:
      labels: { app: airflow-scheduler }
    spec:
      initContainers:
        - name: wait-for-migrations
          image: job-intelligent/airflow:1.0
          imagePullPolicy: IfNotPresent
          args: ["db", "check-migrations", "--migration-wait-timeout", "600"]
          envFrom:
            - configMapRef: { name: app-config }
            - configMapRef: { name: airflow-config }
            - secretRef:    { name: app-secrets }   # DB_PASS, FERNET_KEY, SECRET_KEY, FT_*, ...
          env:
            - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
              value: postgresql+psycopg2://$(DB_USER):$(DB_PASS)@$(DB_HOST):$(DB_PORT)/$(DB_NAME)
            - name: AIRFLOW__CORE__FERNET_KEY
              value: $(FERNET_KEY)
            - name: AIRFLOW__WEBSERVER__SECRET_KEY
              value: $(SECRET_KEY)
      containers:
        - name: scheduler
          image: job-intelligent/airflow:1.0
          imagePullPolicy: IfNotPresent
          args: ["scheduler"]
          ports:
            - name: health
              containerPort: 8974
            - name: logs
              containerPort: 8793
          envFrom:
            - configMapRef: { name: app-config }
            - configMapRef: { name: airflow-config }
            - secretRef:    { name: app-secrets }   # DB_PASS, FERNET_KEY, SECRET_KEY, FT_*, ...
          env:
            - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
              value: postgresql+psycopg2://$(DB_USER):$(DB_PASS)@$(DB_HOST):$(DB_PORT)/$(DB_NAME)
            - name: AIRFLOW__CORE__FERNET_KEY
              value: $(FERNET_KEY)
            - name: AIRFLOW__WEBSERVER__SECRET_KEY
              value: $(SECRET_KEY)
          resources:
            requests: { cpu: 300m, memory: 768Mi }
            limits:   { cpu: "2",  memory: 2Gi }   # tasks (pandas ETL) run in this pod
          startupProbe:
            httpGet: { path: /health, port: health }
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 60
          livenessProbe:
            httpGet: { path: /health, port: health }
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
