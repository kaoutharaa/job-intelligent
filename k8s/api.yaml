# FastAPI backend: 2 replicas behind a ClusterIP Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: job-intelligent
  labels: { app: api }
spec:
  replicas: 2
  selector:
    matchLabels: { app: api }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app: api }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: api
          image: job-intelligent/api:1.0
          imagePullPolicy: IfNotPresent   # image is built locally into minikube
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef: { name: app-config }
          env:
            - name: DB_PASS
              valueFrom: { secretKeyRef: { name: app-secrets, key: DB_PASS } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: app-secrets, key: JWT_SECRET } }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: "1",  memory: 768Mi }   # sklearn + pandas
          # pandas/sklearn imports are slow on first start
          startupProbe:
            httpGet: { path: /live, port: http }
            periodSeconds: 5
            failureThreshold: 24
          # Liveness: process only. A DB outage must NOT trigger restarts.
          livenessProbe:
            httpGet: { path: /live, port: http }
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          # Readiness: DB reachable -> pod receives traffic.
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: job-intelligent
  labels: { app: api }
spec:
  type: ClusterIP
  selector: { app: api }
  ports:
    - name: http
      port: 8000
      targetPort: http
