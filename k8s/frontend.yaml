# React SPA served by nginx, which also proxies /api -> Service "api"
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: job-intelligent
  labels: { app: frontend }
spec:
  replicas: 2
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101           # nginx-unprivileged user
      containers:
        - name: frontend
          image: job-intelligent/frontend:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests: { cpu: 50m,  memory: 32Mi }
            limits:   { cpu: 200m, memory: 128Mi }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: job-intelligent
  labels: { app: frontend }
spec:
  type: NodePort
  selector: { app: frontend }
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
