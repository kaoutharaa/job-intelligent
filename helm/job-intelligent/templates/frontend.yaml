apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels: {{- include "ji.labels" . | nindent 4 }}
    app: frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
      containers:
        - name: frontend
          image: {{ .Values.images.frontend }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          resources: {{- toYaml .Values.frontend.resources | nindent 12 }}
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels: {{- include "ji.labels" . | nindent 4 }}
    app: frontend
spec:
  type: NodePort
  selector: { app: frontend }
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: {{ .Values.frontend.nodePort }}
