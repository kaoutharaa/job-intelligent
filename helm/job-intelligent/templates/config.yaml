apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  labels: {{- include "ji.labels" . | nindent 4 }}
data:
  {{- range $k, $v := .Values.config }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  labels: {{- include "ji.labels" . | nindent 4 }}
data:
  init.sql: |-
{{ .Files.Get "files/init.sql" | indent 4 }}
{{- if .Values.airflow.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: airflow-config
  labels: {{- include "ji.labels" . | nindent 4 }}
data:
  {{- range $k, $v := .Values.airflow.config }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
