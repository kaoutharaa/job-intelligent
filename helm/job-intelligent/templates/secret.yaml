{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  labels: {{- include "ji.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.secrets }}
  {{ $k }}: {{ required (printf "secrets.%s is required (or set existingSecret)" $k) $v | quote }}
  {{- end }}
{{- end }}
